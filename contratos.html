<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MR FIESTA | Event Manager V2</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #080910;
      --bg-soft: #10131d;
      --card: rgba(15, 17, 27, 0.92);
      --line: rgba(255,255,255,0.08);
      --text: #eef2ff;
      --muted: #aeb6d3;
      --blue: #00eaff;
      --pink: #ff2f92;
      --green: #27d17f;
      --yellow: #ffcb3d;
      --red: #ff5d6c;
      --shadow: 0 10px 35px rgba(0,0,0,0.35);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(255, 47, 146, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(0, 234, 255, 0.12) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
      animation: fadeInDown 0.8s ease;
    }
    .brand-header img {
      max-width: 200px;
      filter: drop-shadow(0 0 15px rgba(255, 47, 146, 0.4));
    }

    .app-container {
      width: 100%;
      max-width: 1000px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TABS */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.2);
    }
    .tab-btn {
      flex: 1;
      padding: 18px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--pink), var(--blue));
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }
    .tab-btn.active { color: #fff; }
    .tab-btn.active::after { transform: scaleX(1); }
    .tab-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.03); }

    /* CONTENT PANELS */
    .panel { display: none; padding: 30px; animation: fadeIn 0.4s ease; }
    .panel.active { display: block; }

    /* FORM GROUPS & GRIDS */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .form-group.full { grid-column: 1 / -1; }
    
    label { font-size: 0.85rem; color: var(--blue); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input, select, textarea {
      width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #fff; font-size: 0.95rem; transition: var(--transition);
    }
    textarea { resize: vertical; min-height: 100px; }
    input:focus, select:focus, textarea:focus { 
      outline: none; border-color: var(--pink); box-shadow: 0 0 15px rgba(255, 47, 146, 0.2); background: rgba(0,0,0,0.5);
    }

    /* SALDO BADGE */
    .saldo-badge {
      background: rgba(0, 234, 255, 0.08);
      border: 1px dashed var(--blue);
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--blue);
      margin: 20px 0;
      letter-spacing: 1px;
    }

    /* BUTTONS */
    .action-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
    .btn {
      padding: 14px 20px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem;
      text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: var(--transition);
    }
    .btn:active { transform: scale(0.98); }
    
    .btn-pdf { background: linear-gradient(135deg, var(--pink), #cc156b); color: white; box-shadow: 0 5px 15px rgba(255, 47, 146, 0.3); }
    .btn-pdf:hover { box-shadow: 0 8px 25px rgba(255, 47, 146, 0.5); transform: translateY(-2px); }
    
    .btn-wa { background: linear-gradient(135deg, #25D366, #1da851); color: white; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
    .btn-wa:hover { box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5); transform: translateY(-2px); }
    
    .btn-cal { background: linear-gradient(135deg, #4285F4, #2a65c9); color: white; box-shadow: 0 5px 15px rgba(66, 133, 244, 0.3); }
    .btn-cal:hover { box-shadow: 0 8px 25px rgba(66, 133, 244, 0.5); transform: translateY(-2px); }

    .btn-clear { background: transparent; border: 1px solid var(--muted); color: var(--muted); grid-column: 1 / -1; }
    .btn-clear:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #fff; }

    /* AGENDA STYLES */
    .agenda-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap;}
    .search-bar { flex: 1; min-width: 250px; position: relative; }
    .search-bar input { padding-left: 35px; border-radius: 20px; }
    .search-bar::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; opacity: 0.6; }
    
    .data-tools button { padding: 8px 15px; font-size: 0.8rem; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); color: var(--muted); cursor: pointer; transition: 0.2s;}
    .data-tools button:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .agenda-grid { display: grid; gap: 15px; max-height: 60vh; overflow-y: auto; padding-right: 5px; }
    .agenda-grid::-webkit-scrollbar { width: 6px; }
    .agenda-grid::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .event-card {
      background: rgba(0,0,0,0.4); border-left: 4px solid var(--blue); border-radius: 8px; padding: 18px;
      display: flex; justify-content: space-between; align-items: center; transition: var(--transition);
    }
    .event-card:hover { background: rgba(0,0,0,0.6); transform: translateX(5px); }
    .event-card.urgent { border-left-color: var(--pink); }
    .event-card.past { border-left-color: var(--muted); opacity: 0.6; }
    
    .ev-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: #fff; }
    .ev-details { font-size: 0.85rem; color: var(--muted); display: flex; gap: 15px; flex-wrap: wrap; }
    .ev-details span { display: flex; align-items: center; gap: 5px; }
    .ev-tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; background: rgba(255,255,255,0.1); font-weight: 600; text-transform: uppercase; }
    .tag-urgent { background: rgba(255, 47, 146, 0.2); color: var(--pink); }

    .ev-actions button { background: none; border: none; font-size: 1.2rem; cursor: pointer; opacity: 0.6; transition: 0.2s; padding: 5px;}
    .ev-actions button:hover { opacity: 1; transform: scale(1.1); }
    .btn-del { color: var(--red); }
    .btn-wa-small { color: var(--green); }

    /* FOOTER */
    .footer-links { text-align: center; margin-top: 30px; font-size: 0.8rem; color: var(--muted); }
    .footer-links a { color: var(--blue); text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 600px) {
      .panel { padding: 20px 15px; }
      .action-bar { grid-template-columns: 1fr; }
      .event-card { flex-direction: column; align-items: flex-start; gap: 15px; }
      .ev-actions { width: 100%; display: flex; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 10px; }
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <img id="logoImg" src="prueba de logo fiel.webp" alt="Mr. Fiesta" onerror="this.style.display='none'">
    <img id="imgFirma" src="firma_andre.png" alt="Firma" style="display:none;">
  </div>

  <div class="app-container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('tab-nuevo', this)">📝 Nuevo Contrato</button>
      <button class="tab-btn" onclick="switchTab('tab-agenda', this)">📅 Agenda</button>
    </div>

    <div id="tab-nuevo" class="panel active">
      <form id="contratoForm">
        <div class="form-grid">
          <div class="form-group full">
            <label>👤 Cliente / Agasajado</label>
            <input type="text" id="cliente" placeholder="Ej: Milley Pérez" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label>🆔 DNI / RUC</label>
            <input type="text" id="dni" placeholder="Opcional" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label>📱 Teléfono / WhatsApp</label>
            <input type="text" id="telefono" placeholder="987654321" autocomplete="off">
          </div>

          <div class="form-group">
            <label>📅 Fecha del Evento</label>
            <input type="date" id="fechaEvento">
          </div>

          <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label>🕒 Inicio</label>
              <input type="time" id="horaInicio">
            </div>
            <div>
              <label>⏳ Fin (Aprox)</label>
              <input type="time" id="horaFin">
            </div>
          </div>

          <div class="form-group">
            <label>📍 Distrito / Zona</label>
            <input type="text" id="lugar" placeholder="Ej: Surco, VMT...">
          </div>

          <div class="form-group">
            <label>🏠 Dirección Exacta</label>
            <input type="text" id="direccion" placeholder="Av. Los Rosales 123">
          </div>

          <div class="form-group full">
            <label>📦 Paquete Principal</label>
            <select id="paqueteSelect" onchange="autoFillPaquete()">
              <option value="">-- Seleccionar --</option>
              <option value="Just Dance & Karaoke Party">Just Dance & Karaoke Party</option>
              <option value="Chicoteca en casa">Chicoteca en casa</option>
              <option value="Experiencia Neón">Experiencia Neón</option>
              <option value="Ultra Chicoteca LED">Ultra Chicoteca LED</option>
              <option value="Ultra Chicoteca + Decoración">Ultra Chicoteca + Decoración</option>
              <option value="Personalizado">✏️ Personalizado (Escribir abajo)</option>
            </select>
          </div>

          <div class="form-group full">
            <label>📋 Detalle del Servicio (Editable)</label>
            <textarea id="detalleServicio" placeholder="Descripción de lo que incluye..."></textarea>
          </div>

          <div class="form-group full">
            <label>➕ Adicionales / Notas Extras</label>
            <textarea id="adicionales" placeholder="Hora loca extra, toldo, sillas, proyector..."></textarea>
          </div>

          <div class="form-group">
            <label>💵 Costo Total (S/)</label>
            <input type="number" id="costoTotal" placeholder="0.00" oninput="calcSaldo()">
          </div>

          <div class="form-group">
            <label>💳 Adelanto / Reserva (S/)</label>
            <input type="number" id="adelanto" placeholder="0.00" oninput="calcSaldo()">
          </div>
        </div>

        <div class="saldo-badge" id="saldoContainer">
          SALDO A COBRAR: S/ 0.00
        </div>

        <div class="action-bar">
          <button type="button" class="btn btn-pdf" onclick="generarContrato('pdf')">📄 Crear PDF</button>
          <button type="button" class="btn btn-wa" onclick="generarContrato('wa')">📲 Enviar WA</button>
          <button type="button" class="btn btn-cal" onclick="agendarGoogle()">🗓️ Calendar</button>
          <button type="button" class="btn btn-clear" onclick="limpiarForm()">🧹 Limpiar Todo</button>
        </div>
      </form>
    </div>

    <div id="tab-agenda" class="panel">
      <div class="agenda-tools">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Buscar cliente o distrito..." onkeyup="filtrarAgenda()">
        </div>
        <div class="data-tools">
          <button onclick="exportarAgendaJSON()">⬇️ Respaldar Datos</button>
          <button onclick="importarAgendaJSON()">⬆️ Restaurar</button>
        </div>
      </div>
      
      <div class="agenda-grid" id="agendaList">
        </div>
    </div>
  </div>

  <div class="footer-links">
    MR. FIESTA © 2026 | <a href="https://mrfiesta-pe.github.io/" target="_blank">Web Oficial</a> | Lima, Perú
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    const STORAGE_KEY = 'mrfiesta_db_v2';
    
    // Variables para las imágenes optimizadas
    let logoBase64 = "";
    let firmaBase64 = "";

    const bdPaquetes = {
      "Just Dance & Karaoke Party": "• 1 DJ en vivo\n• Parlante profesional\n• Proyector + ecran con trípode portátil\n• 2 micrófonos inalámbricos\n• Just Dance y Karaoke\n• 6 luces inteligentes con trípode\n\n*Nota: No incluye movilidad.*",
      "Chicoteca en casa": "• 2 horas de animación\n• Animador(a) + DJ\n• Juegos y bailes guiados\n• Luces tipo discoteca y neón\n• Just Dance o Karaoke\n• Invitación virtual\n• Mini hora loca (incluye globos pencil, pulseras neón y accesorios LED)\n• Movilidad incluida (zonas seleccionadas)",
      "Experiencia Neón": "• 3 horas de evento (1 hr glitter y tatuajes neón + 2 hrs animación con animador/a)\n• Juegos modernos + mini hora loca\n• Accesorios LED\n• DJ + sonido profesional\n• Luces inteligentes + luz UV\n• Proyector gigante (Just dance y Karaoke)\n• Máquina de humo o burbujas\n• Movilidad incluida",
      "Ultra Chicoteca LED": "• 3 horas de experiencia (1 hr estación Glitter + 2 hrs show Chicoteca LED)\n• Pista LED 3x2 metros\n• 1 Animador(a) + 1 Staff + DJ + Maquilladora\n• Luces inteligentes + láser\n• Proyección láser del nombre\n• Proyector + ecran gigante para Just Dance y Karaoke\n• Juegos de competencia de acuerdo a la edad\n• Máquina de humo o burbujas\n• Mini hora loca LED (Globos pencil, pulseras neón, limbo, salta soga, burbujas)\n• Movilidad incluida",
      "Ultra Chicoteca + Decoración": "• 4 horas de experiencia (1 hr estación Glitter + 2 hrs animación + 1 hr de DJ extra)\n• Decoración temática base Neón / Glow (Backing con cartel neón happy birthday, 3 mesas acrílicas o cilindros decorativos, accesorios para torta y bocaditos)\n• Pista LED 3x2 metros\n• Animador(a) + staff + DJ + maquilladora\n• Proyector + ecran para Just Dance y Karaoke\n• Mini hora loca LED (globos pencil, pulseras neón y accesorios LED, limbo y salta soga)\n• Movilidad incluida"
    };

    // Función para optimizar imágenes (evita fondos negros y reduce peso)
    function optimizarImagen(url, maxWidth, callback) {
      const img = new Image();
      img.crossOrigin = "Anonymous"; 
      img.onload = function() {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL("image/png"));
      };
      img.onerror = function() { callback(""); };
      img.src = url;
    }

    // Inicialización
    window.onload = () => {
      cargarAgenda();
      // Cargar imágenes optimizadas
      optimizarImagen("prueba de logo fiel.webp", 400, (b64) => { logoBase64 = b64; });
      optimizarImagen("firma_andre.png", 300, (b64) => { firmaBase64 = b64; });
    };

    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      element.classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if(tabId === 'tab-agenda') cargarAgenda();
    }

    function autoFillPaquete() {
      const key = document.getElementById("paqueteSelect").value;
      const txt = document.getElementById("detalleServicio");
      if(bdPaquetes[key]) { txt.value = bdPaquetes[key]; }
      else { txt.value = ""; }
    }

    function calcSaldo() {
      const total = parseFloat(document.getElementById("costoTotal").value) || 0;
      const adelanto = parseFloat(document.getElementById("adelanto").value) || 0;
      const saldo = total - adelanto;
      document.getElementById("saldoContainer").innerHTML = `SALDO A COBRAR: S/ ${saldo.toFixed(2)}`;
      return saldo.toFixed(2);
    }

    function genContratoId() {
      const d = new Date();
      return `MRF-${d.getFullYear().toString().slice(-2)}${String(d.getMonth()+1).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;
    }

    function formatDate(dateStr) {
      if(!dateStr) return "Por definir";
      const options = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('es-PE', options).replace(/^\w/, c => c.toUpperCase());
    }

    // ================== GENERACIÓN DE PDF DUAL PAGE ==================
    function generarContrato(action) {
      const cliente = document.getElementById('cliente').value.trim();
      const paqueteVal = document.getElementById("paqueteSelect").value || document.getElementById("detalleServicio").value.trim();
      
      if(!cliente) return alert("⚠️ Ingresa el nombre del cliente.");
      if(!paqueteVal) return alert("⚠️ Selecciona un paquete o escribe el detalle.");

      const cId = genContratoId();
      const dni = document.getElementById('dni').value || "---";
      const tel = document.getElementById('telefono').value || "---";
      const fRaw = document.getElementById('fechaEvento').value;
      const fFormato = formatDate(fRaw);
      const hIni = document.getElementById('horaInicio').value || "---";
      const hFin = document.getElementById('horaFin').value || "---";
      const lug = document.getElementById('lugar').value || "---";
      const dir = document.getElementById('direccion').value || "---";
      
      const paqueteNom = document.getElementById("paqueteSelect").value || "Personalizado";
      const detalle = document.getElementById("detalleServicio").value || "Servicios acordados.";
      const adic = document.getElementById("adicionales").value;
      
      const tot = (parseFloat(document.getElementById("costoTotal").value)||0).toFixed(2);
      const ade = (parseFloat(document.getElementById("adelanto").value)||0).toFixed(2);
      const sal = calcSaldo();

      // CREACIÓN DEL PDF
      const doc = new jsPDF();

      // Función del Footer para ambas páginas
      const addFooter = (docInst) => {
          const totalPages = docInst.internal.getNumberOfPages();
          for (let i = 1; i <= totalPages; i++) {
              docInst.setPage(i);
              docInst.setFillColor(13, 13, 18);
              docInst.rect(0, 275, 210, 22, "F");
              docInst.setFillColor(255, 0, 127);
              docInst.rect(0, 275, 210, 1, "F");
              
              docInst.setTextColor(255, 255, 255);
              docInst.setFont("helvetica", "normal");
              docInst.setFontSize(8);
              docInst.text("Web: mrfiesta-pe.github.io | Tel: 961 770 164 - 902 602 362 | Correo: mrfiesta.lima@gmail.com", 105, 282, {align: "center"});
              docInst.text("Facebook: Mr. Fiesta Lima | Instagram: @mrfiesta_lima | TikTok: @mrfiesta", 105, 287, {align: "center"});
              docInst.text(`Página ${i} de ${totalPages}`, 195, 292, {align: "right"});
          }
      };

      // === PÁGINA 1: DATOS Y FIRMAS ===
      doc.setFillColor(13, 13, 18);
      doc.rect(0, 0, 210, 40, "F");

      if (logoBase64) {
          try { doc.addImage(logoBase64, 'PNG', 15, 5, 40, 30, 'logo', 'FAST'); } catch(e) {}
      }

      doc.setTextColor(255, 0, 127);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(24);
      doc.text("MR. FIESTA", 70, 20);
      
      doc.setTextColor(0, 243, 255);
      doc.setFontSize(12);
      doc.text("Contrato de Prestación de Servicios", 70, 28);
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(10);
      doc.text(`N° ${cId}`, 160, 20);

      doc.setTextColor(30, 30, 30);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      
      const hoy = new Date().toLocaleDateString('es-ES');
      let y = 50;
      doc.text(`Fecha de emisión: ${hoy}`, 15, y); y+=8;

      doc.setFont("helvetica", "bold");
      doc.text("1. DATOS DEL CLIENTE Y EVENTO", 15, y); y+=6;
      doc.setFont("helvetica", "normal");
      doc.text(`Cliente / Agasajado: ${cliente}`, 15, y); y+=5;
      doc.text(`DNI/RUC: ${dni}`, 15, y); y+=5;
      doc.text(`Teléfono: ${tel}`, 15, y); y+=5;
      doc.text(`Fecha del evento: ${fFormato}`, 15, y); y+=5;
      doc.text(`Horario: Inicio ${hIni} - Fin aprox. ${hFin}`, 15, y); y+=5;
      doc.text(`Lugar: ${lug} - ${dir}`, 15, y); y+=8;

      doc.setFont("helvetica", "bold");
      doc.text(`2. DETALLES DEL PAQUETE: ${paqueteNom.toUpperCase()}`, 15, y); y+=6;
      doc.setFont("helvetica", "normal");
      
      doc.setFontSize(9);
      const detalleLineas = doc.splitTextToSize(`Incluye:\n${detalle}`, 180);
      doc.text(detalleLineas, 15, y);
      y += (detalleLineas.length * 4.5) + 3;

      if (adic.trim() !== "") {
          doc.setFont("helvetica", "bold");
          doc.text("Servicios Adicionales:", 15, y); y+=5;
          doc.setFont("helvetica", "normal");
          const adicLineas = doc.splitTextToSize(adic, 180);
          doc.text(adicLineas, 15, y);
          y += (adicLineas.length * 4.5) + 3;
      }

      doc.setFontSize(10);
      y += 5; 
      doc.setFillColor(245, 245, 245);
      doc.rect(15, y, 180, 20, "F");
      doc.setDrawColor(0, 243, 255);
      doc.rect(15, y, 180, 20, "S");
      y+=6;

      doc.setFont("helvetica", "bold");
      doc.text("3. CONDICIONES ECONÓMICAS", 20, y); y+=7;
      doc.setFont("helvetica", "normal");
      doc.text(`Costo Total: S/ ${tot}`, 20, y); 
      doc.text(`Adelanto: S/ ${ade}`, 80, y); 
      doc.setTextColor(255, 0, 0);
      doc.setFont("helvetica", "bold");
      doc.text(`Saldo a Pagar: S/ ${sal}`, 140, y); 
      
      y += 20;
      doc.setTextColor(80, 80, 80);
      doc.setFont("helvetica", "italic");
      doc.setFontSize(8);
      doc.text("* Las cláusulas y términos de este contrato se encuentran detalladas en la Página 2 del presente documento.", 15, y);

      // FIRMAS EN Y FIJO (Para que no se muevan)
      y = 245; 
      if (firmaBase64) {
          try { doc.addImage(firmaBase64, 'PNG', 125, 222, 50, 22, 'firma', 'FAST'); } catch(e) {}
      }
      doc.setDrawColor(0,0,0);
      doc.line(25, y, 95, y); 
      doc.line(115, y, 185, y); 
      
      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.setTextColor(30, 30, 30);
      
      doc.text(cliente, 60, y, {align: "center", maxWidth: 70}); 
      doc.text("JOSÉ ANDRÉ HIDALGO A.", 150, y, {align: "center"}); 
      
      y += 4;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.text("EL CLIENTE", 60, y, {align: "center"}); 
      doc.text("MR. FIESTA", 150, y, {align: "center"}); 

      // === PÁGINA 2: CLÁUSULAS ===
      doc.addPage();
      
      doc.setFillColor(13, 13, 18);
      doc.rect(0, 0, 210, 15, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(10);
      doc.text(`ANEXO DE TÉRMINOS Y CONDICIONES - Contrato N° ${cId}`, 105, 10, {align: "center"});

      doc.setTextColor(30, 30, 30);
      y = 30; 
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text("4. TÉRMINOS Y CONDICIONES DEL SERVICIO", 15, y); y+=8;
      
      doc.setFontSize(9.5); 

      const clausulas = [
          { t: "1. PAGOS Y CANCELACIONES", b: true },
          { t: "1.1. Reserva y Saldo: La reserva se confirma con un pago adelantado. El cliente cancelará el saldo el mismo día del evento, OBLIGATORIAMENTE antes de instalar los equipos.", b: false },
          { t: "1.2. Cancelaciones: En caso de anulación por el cliente, el dinero de la reserva NO SERÁ REEMBOLSADO bajo ninguna circunstancia.", b: false },
          { t: "2. PUNTUALIDAD Y EVENTO", b: true },
          { t: "2.1. Hora de Inicio: El tiempo comienza a la hora estipulada en este documento. Se brindará una tolerancia máxima de 10 minutos a favor del cliente para iniciar el show.", b: false },
          { t: "3. MOVILIDAD Y LOGÍSTICA", b: true },
          { t: "3.1. Traslado: La movilidad se rige según el paquete contratado. Si el paquete indica movilidad incluida, cubre zonas seleccionadas. Para paquetes que no la incluyen o distritos alejados, se coordinará un recargo adicional previamente.", b: false },
          { t: "4. OBLIGACIONES DEL CLIENTE (ESPACIO Y ENERGÍA)", b: true },
          { t: "4.1. Suministro Eléctrico y Daños: El cliente debe proveer energía estable. Nuestra empresa no se responsabiliza por cortes o variaciones de voltaje del local. Si nuestros equipos sufren daños por esto, el cliente asumirá el 100% de la reparación.", b: false },
          { t: "5. RESPONSABILIDAD Y SEGURIDAD", b: true },
          { t: "5.1. Protección y Daños: En caso de que algún equipo resulte dañado (golpes, derrames), robado o extraviado por acción de invitados, el cliente deberá asumir la totalidad de los costos de reparación.", b: false }
      ];

      clausulas.forEach(item => {
          doc.setFont("helvetica", item.b ? "bold" : "normal");
          const lines = doc.splitTextToSize(item.t, 180);
          doc.text(lines, 15, y);
          y += (lines.length * 5) + 2.5; 
      });

      addFooter(doc);

      // Guardado en BD Local
      const record = { id: Date.now(), cId, cliente, fRaw, fFormato, lug, sal, tel, hIni };
      guardarEnAgenda(record);

      if(action === 'pdf') {
        let safeName = cliente.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        doc.save(`Contrato_${safeName}_${cId}.pdf`);
      } else if(action === 'wa') {
        if(!tel || tel==="---") return alert("Ingresa un celular para WhatsApp.");
        let extra = adic ? `\n➕ *Adicionales:* ${adic}` : "";
        let msj = `¡Hola ${cliente}! 🎉\nSomos *MR. FIESTA* 🪩\n\nTu reserva ha sido registrada.\n📋 *Detalles:*\n- Paquete: ${paqueteNom}\n- Fecha: ${fFormato} a las ${hIni}${extra}\n\n🔐 *Para confirmar tu reserva (S/100 o S/200):*\n✅ *Yape o Plin:* 961770164 (José Hidalgo)\n🏦 *BCP:* 19378091874079\n\n⚠️ *Saldo el día del evento:* S/ ${sal}\n\n🌐 mrfiesta-pe.github.io`;
        window.open(`https://wa.me/51${tel}?text=${encodeURIComponent(msj)}`, '_blank');
      }
    }

    // ================== GOOGLE CALENDAR ==================
    function agendarGoogle() {
      const cliente = document.getElementById('cliente').value.trim();
      const fRaw = document.getElementById('fechaEvento').value;
      const hIni = document.getElementById('horaInicio').value;
      const hFin = document.getElementById('horaFin').value;
      
      if(!cliente || !fRaw || !hIni) return alert("Falta Cliente, Fecha o Hora Inicio para Calendar.");

      const dIni = new Date(`${fRaw}T${hIni}:00`);
      let dFin = new Date(dIni.getTime() + (4*3600000)); 
      if(hFin) {
        const temp = new Date(`${fRaw}T${hFin}:00`);
        if(temp > dIni) dFin = temp;
      }

      const format = d => d.toISOString().replace(/-|:|\.\d\d\d/g, "");
      const title = encodeURIComponent(`MR FIESTA: ${cliente}`);
      const loc = encodeURIComponent(`${document.getElementById('direccion').value}, ${document.getElementById('lugar').value}`);
      const desc = encodeURIComponent(`Cliente: ${cliente}\nPaquete: ${document.getElementById('paqueteSelect').value}\nTel: ${document.getElementById('telefono').value}\nSaldo: S/ ${calcSaldo()}`);
      
      window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${format(dIni)}/${format(dFin)}&details=${desc}&location=${loc}`, '_blank');
    }

    // ================== GESTIÓN DE AGENDA ==================
    function guardarEnAgenda(obj) {
      let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      db.push(obj);
      db.sort((a,b) => new Date(a.fRaw) - new Date(b.fRaw));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    }

    function cargarAgenda(filtro = "") {
      const list = document.getElementById('agendaList');
      list.innerHTML = '';
      let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const hoy = new Date(); hoy.setHours(0,0,0,0);

      if(filtro) {
        const f = filtro.toLowerCase();
        db = db.filter(e => e.cliente.toLowerCase().includes(f) || e.lug.toLowerCase().includes(f));
      }

      if(db.length === 0) {
        list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px;">No hay eventos registrados</div>'; return;
      }

      db.forEach(ev => {
        const fEv = new Date(ev.fRaw + 'T00:00:00');
        const diff = Math.ceil((fEv - hoy) / 86400000);
        
        let statusClass = diff < 0 ? 'past' : (diff <= 3 ? 'urgent' : '');
        let tag = diff < 0 ? 'Concluido' : (diff === 0 ? '¡HOY!' : (diff <= 3 ? `Faltan ${diff} días` : 'Próximo'));
        let tagClass = diff >= 0 && diff <= 3 ? 'tag-urgent' : '';

        const div = document.createElement('div');
        div.className = `event-card ${statusClass}`;
        div.innerHTML = `
          <div class="ev-info">
            <h3>${escapeHtml(ev.cliente)} <span class="ev-tag ${tagClass}">${tag}</span></h3>
            <div class="ev-details">
              <span>📅 ${ev.fFormato} ${ev.hIni}</span>
              <span>📍 ${escapeHtml(ev.lug)}</span>
              <span style="color:var(--blue); font-weight:bold;">💰 S/ ${ev.sal}</span>
            </div>
          </div>
          <div class="ev-actions">
            <button class="btn-wa-small" onclick="abrirWA('${ev.tel}')" title="WhatsApp">💬</button>
            <button class="btn-del" onclick="borrarEvento(${ev.id})" title="Eliminar">🗑️</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function filtrarAgenda() {
      cargarAgenda(document.getElementById('searchInput').value);
    }

    function borrarEvento(id) {
      if(confirm("¿Seguro que deseas eliminar este evento?")) {
        let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        db = db.filter(e => e.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        cargarAgenda();
      }
    }

    function abrirWA(tel) {
      if(!tel || tel==="---") return alert("No hay teléfono guardado.");
      window.open(`https://wa.me/51${tel}`, '_blank');
    }

    function limpiarForm() {
      document.getElementById("contratoForm").reset();
      document.getElementById("saldoContainer").innerHTML = "SALDO A COBRAR: S/ 0.00";
    }

    function exportarAgendaJSON() {
      const agenda = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const blob = new Blob([JSON.stringify(agenda, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mrfiesta_bd.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importarAgendaJSON() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = 'application/json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if(!Array.isArray(data)) throw new Error('Format');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            cargarAgenda(); alert('✅ Base de datos restaurada.');
          } catch(err) { alert('❌ Error al leer el archivo.'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function escapeHtml(text) {
      return String(text || "").replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
      });
    }
  </script>
