name: Copy website media to R2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r2-upload.yml'
permissions:
  contents: read
concurrency:
  group: r2-media-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Check connection configuration
        id: connection
        shell: bash
        run: |
          if [[ -n "$R2_ENDPOINT" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "R2 upload is waiting for R2_ENDPOINT, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.connection.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.connection.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Install S3 client
        if: steps.connection.outputs.ready == 'true'
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Copy media and verify private and public access
        if: steps.connection.outputs.ready == 'true'
        run: python scripts/upload_media_r2.py
      - name: Save verified upload manifest
        if: steps.connection.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r2-upload-manifest
          path: r2-upload-manifest.json
          if-no-files-found: error
          retention-days: 30
