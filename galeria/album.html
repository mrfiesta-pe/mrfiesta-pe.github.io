<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de revisión · Mr. Fiesta</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Estilos del Álbum -->
  <link rel="stylesheet" href="album.css">
</head>
<body>

  <div class="album-app">
    <!-- Barra Superior -->
    <header class="album-topbar">
      <a href="index.html?galeria=" id="back-to-gallery" class="back-link">
        <i data-lucide="arrow-left"></i> Volver a la galería
      </a>
      <div class="album-identity">
        <span>MR. FIESTA</span>
        <i></i>
        <span>ÁLBUM DE REVISIÓN</span>
      </div>
      <button id="fullscreen" class="icon-button" title="Pantalla completa">
        <i data-lucide="maximize-2"></i>
      </button>
    </header>

    <!-- Área Principal del Libro -->
    <main class="album-stage" id="album-stage">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>

      <!-- Estado de Carga -->
      <div id="album-loading" class="album-loading">
        <span></span>
        <p>Componiendo álbum digital...</p>
      </div>

      <!-- Mensaje de Error -->
      <div id="album-error" class="album-error hidden"></div>

      <!-- Contenedor del Libro -->
      <div id="book" class="book hidden">
        <div class="book-shadow"></div>
        <div id="book-spread" class="book-spread"></div>
        <div class="book-spine"></div>
      </div>
    </main>

    <!-- Controles de Navegación -->
    <footer id="album-controls" class="album-controls hidden">
      <button id="previous-page" class="nav-button">
        <i data-lucide="arrow-left"></i> <span>Anterior</span>
      </button>
      
      <div class="page-progress">
        <strong id="page-count">1 — 2</strong>
        <span id="page-caption">Portada</span>
        <div><i id="page-bar" style="width: 0%;"></i></div>
      </div>

      <button id="next-page" class="nav-button">
        <span>Siguiente</span> <i data-lucide="arrow-right"></i>
      </button>
    </footer>
  </div>

  <!-- Script para mantener el slug dinámico en el botón de retorno -->
  <script>
    const urlParams = new URLSearchParams(location.search);
    const slugGaleria = urlParams.get('galeria');
    if (slugGaleria) {
      const btnVolver = document.getElementById('back-to-gallery');
      if (btnVolver) {
        btnVolver.href = `index.html?galeria=${slugGaleria}`;
      }
    }
  </script>

  <!-- Lógica Principal del Visor -->
  <script type="module" src="album.js"></script>
</body>
</html>
